<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your StudyFlow student account.">
    <title>Create Account | StudyFlow</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <script src="../js/storage.js" defer></script>
    <script src="../js/auth.js" defer></script>
</head>
<body class="auth-page">

    <header class="auth-header container">
        <a href="../index.html" class="brand">
            <span class="brand-icon">S</span>
            <span>StudyFlow</span>
        </a>

        <a href="../index.html" class="back-link">← Back to home</a>
    </header>

    <main class="auth-main container">

        <section class="auth-card">

            <div class="auth-heading">
                <div class="auth-symbol">✦</div>
                <span class="section-label">START YOUR JOURNEY</span>

                <h1>Create your <span class="text-accent">account.</span></h1>

                <p>
                    Build better study habits and take control
                    of your academic journey.
                </p>
            </div>

            <div id="auth-message" class="auth-message" role="status" aria-live="polite"></div>

            <form id="register-form" class="auth-form">

                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        minlength="2"
                        maxlength="60"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-email">Email address</label>
                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small>Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary auth-submit">
                    Create Account <span>→</span>
                </button>

            </form>

            <div class="auth-divider">
                <span>ALREADY HAVE AN ACCOUNT?</span>
            </div>

            <p class="auth-switch">
                Welcome back?
                <a href="login.html">Log in here</a>
            </p>

        </section>

        <p class="auth-footer-note">
            Plan smarter. Study better. Achieve more.
        </p>

    </main>

</body>
</html>
